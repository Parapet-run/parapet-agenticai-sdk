[project]
name = "parapetai-conformance"
version = "0.1.0"
requires-python = ">=3.12"
# Internal test harness, not a distributable. Same upload guard as
# gateway/ and control-plane/ -- only parapetai-agent/ reaches PyPI.
classifiers = ["Private :: Do Not Upload"]
dependencies = ["httpx>=0.28,<1.0", "pytest>=8.3", "pyyaml>=6.0,<7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
