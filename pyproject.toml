[project]
name = "parapetai-agent"
version = "0.1.1"
requires-python = ">=3.12"
description = "Open-source in-process governance for AI agent frameworks: Cedar-governed model/tool calls via build_middleware()/GovernedAgent, plus the Cedar engine, request/decision shapes, PEP<->control-plane protocol client, and Ed25519 PEP identity they run on."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Parapet" }]
keywords = [
    "agent",
    "governance",
    "cedar",
    "policy",
    "authorization",
    "llm",
    "guardrails",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cedarpy>=4.0.0,<5.0",
    "structlog>=24.4,<26.0",
    "httpx>=0.28,<1.0",
    # pep_identity.py / signing.py consumers -- Ed25519 keypair generation/signing.
    "cryptography>=43.0,<47.0",
    # policy/hooks.py GovernanceHook -- opentelemetry-api only (a verified no-op
    # when no tracer is configured), so this is safe to depend on unconditionally.
    "opentelemetry-api>=1.20,<2.0",
]

[project.urls]
Homepage = "https://github.com/Parapet-run/parapet-agenticai-sdk"
Repository = "https://github.com/Parapet-run/parapet-agenticai-sdk"
Issues = "https://github.com/Parapet-run/parapet-agenticai-sdk/issues"

[project.optional-dependencies]
# Microsoft Agent Framework integration + OTel export to the control plane.
maf = [
    "agent-framework>=1.13,<2.0",
    "mcp>=1.24,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    # Backs configure_otel(otlp_endpoint=)'s real OTLPSpanExporter/OTLPLogExporter,
    # pointed at the control plane's OTLP receiver (/v1/traces, /v1/logs).
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
]
# IdentityMiddleware (Starlette BaseHTTPMiddleware) only -- the core stays
# usable by a non-web consumer (CLI, worker) without a web framework.
web = ["starlette>=0.38,<1.0"]
# NOTE: the higher-accuracy groundedness backend (groundedness.py 'hhem' via
# _hhem.py) needs transformers + torch, deliberately NOT declared as an extra
# (torch drags the CUDA wheel stack into the lockfile). Enable explicitly with
# `pip install transformers torch` -- see docs/GROUNDEDNESS_HHEM.md. The lexical
# backend is the dependency-free default.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff",
    "mypy",
    "opentelemetry-sdk>=1.20,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parapetai_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/parapetai_agent", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
