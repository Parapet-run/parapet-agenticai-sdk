name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # This repo is a uv workspace: the root package (parapetai-agent) plus
      # gateway/ and mcp-server/. `uv sync` installs the ROOT only, so the
      # gateway suite runs under `uv run --package parapetai-gateway` -- that
      # is what the Makefile targets do, and running gateway/tests from the
      # root venv fails with ModuleNotFoundError: parapetai_gateway.
      - name: Install
        run: |
          uv sync --all-extras
          # Pin the tested agent-framework line for deterministic CI; the public
          # compatibility range in pyproject stays broad (>=1.13,<2.0).
          uv pip install "agent-framework==1.13.0"
          # langchain-openai is NOT a parapetai-agent[langgraph] dependency
          # (parapetai_agent.langgraph never imports it) -- it's needed only
          # by tests/test_conformance_frameworks.py's TestLangGraph, which
          # exercises the framework-neutral Governor fallback against a real
          # ChatOpenAI. Without this pin that test class silently skips via
          # pytest.importorskip, same as it always has in CI until now.
          #
          # openai<3 is pinned here too -- not for langchain-openai's own
          # sake (it accepts >=2.45,<4) but because nothing else in this
          # graph bounds `openai` either, so an unpinned install lets the
          # resolver land on whatever's newest on PyPI. openai>=3 defaults
          # to a new async transport, `httpx2`, as its httpx replacement;
          # httpx2 2.13.0 shipped an async-teardown regression that races
          # pytest-asyncio's event-loop close and fails
          # TestLangGraph::test_denied_tool_is_blocked with `RuntimeError:
          # Event loop is closed` -- unrelated to anything this repo
          # governs. `uv pip install` also never prunes an
          # already-installed package once a later pin (like the
          # agent-framework one above) stops needing it, so a prior step
          # landing on openai>=3 leaves httpx2 installed even after openai
          # itself gets pinned back down -- pin openai directly so the
          # resolver never reaches for it in the first place.
          uv pip install "langchain-openai>=1.4,<2.0" "openai<3"

      # The dev environment above has every extra, so it can never notice that the
      # BASE install (`pip install parapetai-agent`) stopped importing -- which is
      # exactly what happened when the OpenTelemetry SDK was imported at module
      # level. This builds the wheel and installs it, alone, into a clean venv.
      - name: Base install smoke (no extras)
        run: make smoke-base

      # `make check` is lint + typecheck + test across BOTH packages, so CI
      # runs exactly what a contributor runs locally -- one definition, no
      # drift between the two.
      - name: Check
        run: make check
