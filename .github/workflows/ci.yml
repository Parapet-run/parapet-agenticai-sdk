name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (fixture subprocesses use it)
        uses: astral-sh/setup-uv@v5

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[maf,web,dev]"
          # Pin the tested agent-framework line for deterministic CI; the public
          # compatibility range in pyproject stays broad (>=1.13,<2.0).
          pip install "agent-framework==1.13.0"

      - name: Lint
        run: ruff check src tests

      - name: Type-check
        run: mypy src

      - name: Test
        run: pytest -q
