name: docs

# Builds mkdocs.yml + docs/ with MkDocs Material and deploys to GitHub
# Pages. Separate from ci.yml/release.yml on purpose: this never touches
# the Cedar engine or either published package, so it has its own trigger
# (docs/mkdocs.yml changes, or manual) instead of running on every push.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push wins over an in-flight
# older one rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # --extra docs only -- the docs build never imports parapetai_agent
      # itself (hand-authored reference pages, no mkdocstrings/autodoc), so
      # it doesn't need --all-extras the way `make check` does.
      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Build site
        run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
