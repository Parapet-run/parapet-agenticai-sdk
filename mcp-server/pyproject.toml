[project]
name = "parapetai-mcp"
version = "0.4.2"
requires-python = ">=3.12"
description = "MCP server for Claude Code (and other MCP clients): device-code login to a Parapet control plane, provisioning agents, and pulling the exact quickstart config a codebase needs -- ships six packaged skills: parapet-maf and parapet-adk (retrofit an existing project, one per framework integration), parapet-quickdemo (generate a runnable identity-based governance demo from nothing), parapet-install-prereqs (detect and, with per-step approval, install Python/pipx/uv), and parapet-audit / parapet-audit-fix (static AST scan for ungoverned model/tool calls, scored high/medium/low, plus a follow-up pass that wraps flagged sites in GovernedAgent/GovernedRunner)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Parapet" }]
keywords = ["mcp", "agent", "governance", "cedar", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # Same pin as parapetai-agent's `maf` extra -- both ultimately talk the
    # same official MCP SDK; keeping the pin identical avoids two
    # independently-drifting version ranges for one dependency in this repo.
    "mcp>=1.24,<2.0",
    "httpx>=0.28,<1.0",
]

[project.scripts]
parapetai-mcp = "parapetai_mcp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parapetai_mcp"]

